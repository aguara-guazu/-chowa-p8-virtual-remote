name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  BUILD_TOOLS_VERSION: 35.0.0
  PLATFORM: android-34

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER="$(command -v sdkmanager || true)"
          [ -n "$SDKMANAGER" ] || { echo "::error::sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "build-tools;${BUILD_TOOLS_VERSION}" "platforms;${PLATFORM}" > /dev/null

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.keystore"
            echo "KEYSTORE=$RUNNER_TEMP/signing.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning title=Ephemeral signing key::KEYSTORE_BASE64 is not set. The APK is signed with a key generated for this run; it cannot upgrade an installed build signed with another key."
            echo "KEYSTORE=$RUNNER_TEMP/ephemeral.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./android/build.sh

      - name: Verify signature
        run: |
          CERT="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs android/build/chowa-remote.apk | grep -m1 'SHA-256')"
          echo "$CERT"
          {
            echo "### chowa-remote.apk ${VERSION_NAME} (versionCode ${VERSION_CODE})"
            echo
            echo "\`$CERT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: chowa-remote-${{ steps.version.outputs.version_name }}
          path: android/build/chowa-remote.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chowa-remote-${{ needs.build.outputs.version_name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET="chowa-remote-${GITHUB_REF_NAME}.apk"
          mv chowa-remote.apk "$ASSET"
          gh release create "$GITHUB_REF_NAME" "$ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
